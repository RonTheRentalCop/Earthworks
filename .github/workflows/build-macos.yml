name: Build macOS and Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        working-directory: ${{ runner.temp }}
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Export universal macOS app (Apple Silicon + Intel)
        run: |
          mkdir -p build
          "$GODOT" --headless --import || true
          "$GODOT" --headless --export-release "macOS" build/Earthworks-macOS.zip
          ls -lh build

      - name: Export Windows app (64-bit .exe plus the WebRTC .dll for online play)
        continue-on-error: true  # never hold back the Mac build
        run: |
          mkdir -p build/windows
          "$GODOT" --headless --export-release "Windows" build/windows/Earthworks.exe
          ls build/windows
          cd build/windows && zip -q ../Earthworks-Windows.zip Earthworks.exe *.dll
          ls -lh ..

      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: Earthworks-builds
          path: |
            build/Earthworks-macOS.zip
            build/Earthworks-Windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            build/Earthworks-macOS.zip
            build/Earthworks-Windows.zip
          body: |
            Earthworks ${{ github.ref_name }}

            **Windows:** download Earthworks-Windows.zip, unzip it (keep the .dll next to the .exe) and run Earthworks.exe. It isn't
            signed, so Windows SmartScreen may warn the first time: click "More info" → "Run anyway".

            **macOS** (universal: Apple Silicon and Intel): download Earthworks-macOS.zip and unzip it.
            The app is not notarized by Apple, so either right-click Earthworks.app → Open, or run this
            once in Terminal from the folder you unzipped it to:

                xattr -cr Earthworks.app

            **Multiplayer:** one player picks MULTIPLAYER → HOST ONLINE and reads out the room code; the
            others pick JOIN WITH CODE. No port forwarding or VPN needed. Everyone needs the same version.
